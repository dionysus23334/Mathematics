site_name: 经典数学理论体系
site_description: 两套并行目录：按理论依赖组织的经典数学体系，以及按学习阶段组织的通识教育路线。
site_author: dionysus23334
site_url: https://dionysus23334.github.io/Mathematics/
repo_url: https://github.com/dionysus23334/Mathematics
repo_name: dionysus23334/Mathematics
edit_uri: edit/main/docs/
copyright: 个人学习整理 · 非官方教材 · 定义与证明以所列前置为准

theme:
  name: material
  language: zh
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

nav:
  - ← 个人主页: https://dionysus23334.github.io/study-blogs/
  - 首页: index.md
  - 常规体系:
      - 总览: theory/index.md
      - 第一卷 · 逻辑语言与证明:
          - 本章: theory/01-logic.md
      - 第二卷 · 集合、关系与映射:
          - 本章: theory/02-sets.md
      - 第三卷 · 自然数与数系:
          - 本章: theory/03-numbers.md
      - 第四卷 · 代数结构与线性空间:
          - 本章: theory/04-algebra.md
      - 第五卷 · 空间、极限与连续:
          - 本章: theory/05-spaces.md
      - 第六卷 · 核心分支:
          - 本章: theory/06-branches.md
      - 第七卷 · 深入理论:
          - 本章: theory/07-advanced.md
  - Rudin 体系:
      - 第一卷 · 实数系与复数系:
          - 正文: theory/rudin/01-real-complex.md
      - 第二卷 · 基础拓扑:
          - 正文: theory/rudin/02-basic-topology.md
      - 第三卷 · 数列与级数:
          - 正文: theory/rudin/03-sequences-series.md
      - 第四卷 · 连续性:
          - 正文: theory/rudin/04-continuity.md
      - 第五卷 · 微分法:
          - 正文: theory/rudin/05-differentiation.md
      - 第六卷 · Riemann–Stieltjes 积分:
          - 正文: theory/rudin/06-riemann-stieltjes.md
      - 第七卷 · 函数序列与函数项级数:
          - 正文: theory/rudin/07-function-sequences.md
      - 第八卷 · 特殊函数:
          - 正文: theory/rudin/08-special-functions.md
      - 第九卷 · 多元函数:
          - 正文: theory/rudin/09-multivariable.md
      - 第十卷 · 微分形式的积分:
          - 正文: theory/rudin/10-differential-forms.md
      - 第十一卷 · Lebesgue 理论:
          - 正文: theory/rudin/11-lebesgue.md
  - 教育阶段体系:
      - 总览: stages/index.md
      - 初等数学: stages/elementary.md
      - 中等数学: stages/secondary.md
      - 数学竞赛: stages/competition.md
      - 高等数学: stages/university.md
  - 参考:
      - 学习规则: principles.md
      - 证明状态与核心证明: theory/proofs.md
      - 术语表: glossary.md
      - 缩写与英文术语: abbreviations.md
      - 来源与出处: sources.md

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - fenced_code
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: true
      linenums_style: inline
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: [round]
      block_syntax: [square]
  - pymdownx.tabbed:
      alternate_style: true

exclude_docs: |
  .DS_Store

validation:
  links:
    absolute_links: ignore
    unrecognized_links: warn

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/table-wrap.js
  - javascripts/rudin-toc.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
