site_name: 数学
site_description: 数学总页：古典学术体系（常规体系 + Rudin 体系）与教育阶段体系。
site_author: dionysus23334
site_url: https://dionysus23334.github.io/Mathematics/
repo_url: https://github.com/dionysus23334/Mathematics
repo_name: dionysus23334/Mathematics
edit_uri: edit/main/docs/
copyright: 个人学习整理 · 非官方教材 · 定义与证明以所列前置为准

theme:
  name: material
  language: zh
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

nav:
  - ← 个人主页: https://dionysus23334.github.io/study-blogs/
  - 首页: index.md
  - 古典学术体系:
      - 常规体系:
          - 总览: theory/index.md
          - 逻辑语言与证明: theory/01-logic.md
          - 集合、关系与映射: theory/02-sets.md
          - 自然数与数系: theory/03-numbers.md
          - 代数结构与线性空间: theory/04-algebra.md
          - 空间、极限与连续: theory/05-spaces.md
          - 核心分支: theory/06-branches.md
          - 深入理论: theory/07-advanced.md
      - Rudin 体系:
          - 第 1 章 · 实数系与复数系: theory/rudin/01-real-complex.md
          - 第 2 章 · 基础拓扑: theory/rudin/02-basic-topology.md
          - 第 3 章 · 数列与级数: theory/rudin/03-sequences-series.md
          - 第 4 章 · 连续性: theory/rudin/04-continuity.md
          - 第 5 章 · 微分法: theory/rudin/05-differentiation.md
          - 第 6 章 · Riemann–Stieltjes 积分: theory/rudin/06-riemann-stieltjes.md
          - 第 7 章 · 函数序列与函数项级数: theory/rudin/07-function-sequences.md
          - 第 8 章 · 特殊函数: theory/rudin/08-special-functions.md
          - 第 9 章 · 多元函数: theory/rudin/09-multivariable.md
          - 第 10 章 · 微分形式的积分: theory/rudin/10-differential-forms.md
          - 第 11 章 · Lebesgue 理论: theory/rudin/11-lebesgue.md
  - 教育阶段体系:
      - 总览: stages/index.md
      - 初等数学: stages/elementary.md
      - 中等数学: stages/secondary.md
      - 数学竞赛: stages/competition.md
      - 高等数学: stages/university.md
  - 参考:
      - 学习规则: principles.md
      - 证明状态与核心证明: theory/proofs.md
      - 术语表: glossary.md
      - 缩写与英文术语: abbreviations.md
      - 来源与出处: sources.md

plugins:
  - search:
      lang:
        - zh
        - en
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: zh
          name: 中文
          default: true
          build: true
          site_name: 数学
          site_description: 数学总页：古典学术体系（常规体系 + Rudin 体系）与教育阶段体系。
        - locale: en
          name: English
          build: true
          site_name: Mathematics
          site_description: Mathematics hub — Classical Academic System (Regular + Rudin) and the Educational Stage System.
          site_url: https://dionysus23334.github.io/Mathematics/en/
          theme:
            language: en
          nav_translations:
            '← 个人主页': '← Study archive'
            '首页': 'Home'
            '古典学术体系': 'Classical Academic System'
            '常规体系': 'Regular System'
            '总览': 'Overview'
            '逻辑语言与证明': 'Logic, Language, and Proof'
            '集合、关系与映射': 'Sets, Relations, and Mappings'
            '自然数与数系': 'Natural Numbers and Number Systems'
            '代数结构与线性空间': 'Algebraic Structures and Linear Spaces'
            '空间、极限与连续': 'Spaces, Limits, and Continuity'
            '核心分支': 'Core Branches'
            '深入理论': 'Advanced Theory'
            'Rudin 体系': 'Rudin System'
            '第 1 章 · 实数系与复数系': 'Chapter 1 · Real and Complex Number Systems'
            '第 2 章 · 基础拓扑': 'Chapter 2 · Basic Topology'
            '第 3 章 · 数列与级数': 'Chapter 3 · Sequences and Series'
            '第 4 章 · 连续性': 'Chapter 4 · Continuity'
            '第 5 章 · 微分法': 'Chapter 5 · Differentiation'
            '第 6 章 · Riemann–Stieltjes 积分': 'Chapter 6 · Riemann–Stieltjes Integration'
            '第 7 章 · 函数序列与函数项级数': 'Chapter 7 · Sequences and Series of Functions'
            '第 8 章 · 特殊函数': 'Chapter 8 · Some Special Functions'
            '第 9 章 · 多元函数': 'Chapter 9 · Functions of Several Variables'
            '第 10 章 · 微分形式的积分': 'Chapter 10 · Integration of Differential Forms'
            '第 11 章 · Lebesgue 理论': 'Chapter 11 · Lebesgue Theory'
            '教育阶段体系': 'Educational Stage System'
            '初等数学': 'Elementary Mathematics'
            '中等数学': 'Secondary Mathematics'
            '数学竞赛': 'Mathematical Competitions'
            '高等数学': 'University Mathematics'
            '参考': 'Reference'
            '学习规则': 'Study Rules'
            '证明状态与核心证明': 'Proof Status and Core Proofs'
            '术语表': 'Glossary'
            '缩写与英文术语': 'Abbreviations and English Terms'
            '来源与出处': 'Sources and Attribution'

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - fenced_code
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: true
      linenums_style: inline
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: [round]
      block_syntax: [square]
  - pymdownx.tabbed:
      alternate_style: true

exclude_docs: |
  .DS_Store

validation:
  links:
    absolute_links: ignore
    unrecognized_links: warn

extra_css:
  - stylesheets/base.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/table-wrap.js
  - javascripts/lang-switch.js
  - javascripts/rudin-toc.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  alternate:
    - name: 中文
      link: https://dionysus23334.github.io/Mathematics/
      lang: zh
    - name: English
      link: https://dionysus23334.github.io/Mathematics/en/
      lang: en
